# soccer-news — newsroom runtime: detect -> frozen packet -> compose -> gates -> publish/hold.
# Deploy: docs/RELEASE.md (scripts/release/deploy-worker.sh soccer-news first|upload|deploy <id>).
# Secrets (wrangler secret put): SOCCER_MODEL_SUPABASE_URL, SOCCER_MODEL_SUPABASE_SERVICE_ROLE_KEY, NEWS_ADMIN_TOKEN
# Editorial desk (REQUIRED; new stories HOLD without it): OPENAI_API_KEY (secret), model gpt-5.6-sol, override var NEWS_DESK_MODEL.
# Legacy optional pass, only with NEWS_DESK=off (not used): NEWS_LLM=on (var), ANTHROPIC_API_KEY (secret).
name = "soccer-news"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["7,37 * * * *"] # the only schedule; the temporary */10 backlog migration is retired (no automatic OpenAI backlog processing)

[vars]
NEWS_ENABLED = "on"
NEWS_LLM = "off"
# Desk output cap (reasoning + story). Evidence 2026-09-29 canary on the richest packet (Bayern 7-0 recap): 2,252 output
# tokens incl. 1,234 reasoning -> 4000 per the owner cost brief (5000 only if a legitimate story is shown to exceed it).
NEWS_DESK_MAX_OUTPUT_TOKENS = "4000"
# League-phase boundaries (profiles.js LEAGUE_PHASE_CONFIG): explicit production config; a missing var skips that
# competition (no hidden code default). UCL/UEL league phase ends after matchday 8 (late January 2027); UWCL = ESPN
# season type 1 end 2026-12-18 (docs/evidence/world/espn-world-discovery-2026-10-03.json).
UCL_LEAGUE_PHASE_END = "2027-02-01T00:00:00Z"
UEL_LEAGUE_PHASE_END = "2027-02-01T00:00:00Z"
UWCL_LEAGUE_PHASE_END = "2026-12-19T00:00:00Z"
# Article-market writer freeze (market-freeze.js): OFF until the owner decides to ship it (separate decision).
NEWS_MARKET_FREEZE = "off"
# Migration 20260929001300 (routing columns on soccer_news_openai_usage) APPLIED 2026-09-29 (sha 4e7ef213): the ledger
# rows carry the V4 routing fields. Off = routing fields in KV only.
SOCCER_LEDGER_ROUTING = "on"

[[kv_namespaces]]
binding = "SOCCER_STATE"
id = "3e665f75414849578249f5aed979b868"

# Article market packets (market-freeze.js): read propsports-markets /v1/article-market through a Service Binding
# (a workers.dev -> workers.dev fetch fails with CF 1042). Not a billable resource.
[[services]]
binding = "MARKETS"
service = "propsports-markets"

[limits]
cpu_ms = 60000

[observability]
enabled = true
