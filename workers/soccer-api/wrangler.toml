# soccer-api — read-only public API over the canonical soccer graph.
# Deploy: docs/RELEASE.md. Secrets: SOCCER_MODEL_SUPABASE_URL, SOCCER_MODEL_SUPABASE_SERVICE_ROLE_KEY
name = "soccer-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["20 */6 * * *"]

[[kv_namespaces]]
binding = "SOCCER_STATE"
id = "3e665f75414849578249f5aed979b868"

# Media bytes (read-only use): approved, content-addressed objects under soccer-source/media/.
[[r2_buckets]]
binding = "SOCCER_SOURCE"
bucket_name = "soccer-source"

[observability]
enabled = true
