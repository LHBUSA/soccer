name = "soccer-video-autopilot"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Official-video discovery. Baseline uses YouTube's public Atom channel feed + oEmbed;
# YOUTUBE_API_KEY is optional enrichment, not required.
[triggers]
crons = ["13,43 * * * *"]

[[kv_namespaces]]
binding = "SOCCER_STATE"
id = "3e665f75414849578249f5aed979b868"

[observability]
enabled = true

# Secrets:
#   SOCCER_MODEL_SUPABASE_URL
#   SOCCER_MODEL_SUPABASE_SERVICE_ROLE_KEY
# Optional only:
#   VIDEO_ADMIN_TOKEN   # manual /admin/run only; cron does not need it
#   YOUTUBE_API_KEY     # richer duration/region metadata; baseline works without it
