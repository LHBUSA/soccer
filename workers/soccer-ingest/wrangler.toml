# soccer-ingest — captures sources into R2, writes the canonical graph (SPORTS Supabase).
# Deploy: docs/RELEASE.md (wrangler versions upload -> /health -> versions deploy).
# Secrets (wrangler secret put): SOCCER_MODEL_SUPABASE_URL, SOCCER_MODEL_SUPABASE_SERVICE_ROLE_KEY, INGEST_ADMIN_TOKEN
name = "soccer-ingest"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "SOCCER_SOURCE"
bucket_name = "soccer-source"

[[kv_namespaces]]
binding = "SOCCER_STATE"
id = "3e665f75414849578249f5aed979b868"

[limits]
cpu_ms = 60000

[observability]
enabled = true

[vars]
# Soccer Algo V1 Official Picks. Owner G7 sign-off 2026-09-29 (docs/evidence/algo/ACCEPTANCE.md).
# "on" issues forecasts/picks from the frozen spec; anything else = off. Kill switch: set to "off" and release.
ALGO_OFFICIAL = "on"
